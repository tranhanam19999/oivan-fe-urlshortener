<mat-toolbar color="primary" class="topbar">
  <span>URL Shortener</span>
</mat-toolbar>

<div class="container">
  <mat-card class="card">
    <mat-tab-group>
      <mat-tab label="Encode">
        <form [formGroup]="encodeForm" (ngSubmit)="onEncode()" class="form">
          <mat-form-field appearance="outline" class="full">
            <mat-label>Enter URL to shorten</mat-label>
            <input matInput formControlName="url" placeholder="https://example.com/path" />
            <mat-error *ngIf="encodeForm.get('url')?.errors?.['invalidUrl']">Invalid URL</mat-error>
            <mat-error *ngIf="encodeForm.get('url')?.errors?.['invalidScheme']">Use http(s) scheme</mat-error>
            <mat-error *ngIf="encodeForm.get('url')?.errors?.['required']">URL is required</mat-error>
          </mat-form-field>

          <div class="actions">
            <button mat-flat-button color="primary" type="submit">Encode</button>
            <mat-progress-spinner *ngIf="loadingSvc.loading$ | async" diameter="24" mode="indeterminate"></mat-progress-spinner>
          </div>

          <div *ngIf="encodeResult" class="result">
            <p><strong>Short URL:</strong></p>
            <div class="result-row">
              <a [href]="encodeResult" target="_blank">{{ encodeResult }}</a>
              <button mat-icon-button (click)="copy(encodeResult)" aria-label="Copy">
                <mat-icon>content_copy</mat-icon>
              </button>
            </div>
          </div>
        </form>
      </mat-tab>

      <mat-tab label="Decode">
        <form [formGroup]="decodeForm" (ngSubmit)="onDecode()" class="form">
          <mat-form-field appearance="outline" class="full">
            <mat-label>Enter short URL to expand</mat-label>
            <input matInput formControlName="url" placeholder="https://short.ly/abcd" />
            <mat-error *ngIf="decodeForm.get('url')?.errors?.['invalidUrl']">Invalid URL</mat-error>
            <mat-error *ngIf="decodeForm.get('url')?.errors?.['invalidScheme']">Use http(s) scheme</mat-error>
            <mat-error *ngIf="decodeForm.get('url')?.errors?.['required']">URL is required</mat-error>
          </mat-form-field>

          <div class="actions">
            <button mat-flat-button color="primary" type="submit">Decode</button>
            <mat-progress-spinner *ngIf="loadingSvc.loading$ | async" diameter="24" mode="indeterminate"></mat-progress-spinner>
          </div>

          <div *ngIf="decodeResult" class="result">
            <p><strong>Original URL:</strong></p>
            <div class="result-row">
              <a [href]="decodeResult" target="_blank">{{ decodeResult }}</a>
              <button mat-icon-button (click)="copy(decodeResult)" aria-label="Copy">
                <mat-icon>content_copy</mat-icon>
              </button>
            </div>
          </div>
        </form>
      </mat-tab>
    </mat-tab-group>
  </mat-card>
</div>
